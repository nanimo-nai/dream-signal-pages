name: Validate and publish static Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate prebuilt static release
        run: |
          node --input-type=module <<'NODE'
          import { readFile, readdir, lstat } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import assert from 'node:assert/strict';
          const release = JSON.parse(await readFile('release.json','utf8'));
          const files = [];
          async function walk(dir,prefix='') {
            for(const entry of await readdir(dir)) {
              const path = dir+'/'+entry, rel = prefix+entry, info = await lstat(path);
              assert(!info.isSymbolicLink(), 'Symlink rejected');
              if(info.isDirectory()) await walk(path,rel+'/'); else files.push(rel);
            }
          }
          await walk('site');
          assert.deepEqual(files.sort(), Object.keys(release.files).sort());
          for(const file of files) {
            assert(/^(index\.html|404\.html|\.nojekyll|robots\.txt|manifest\.webmanifest|sw\.js|icon\.svg|icon-(192|512)\.png|THIRD_PARTY_NOTICES\.txt|fonts\/(NotoSansSC\.ttf|OFL\.txt)|assets\/[a-zA-Z0-9_-]+\.(js|css))$/.test(file), 'Unexpected file');
            assert.equal(createHash('sha256').update(await readFile('site/'+file)).digest('hex'), release.files[file]);
          }
          const html = await readFile('site/index.html','utf8');
          assert(html.includes('noindex, nofollow, noarchive'));
          assert(!html.includes('sourceMappingURL'));
          assert.equal(release.base, '/'+process.env.GITHUB_REPOSITORY.split('/')[1]+'/');
          NODE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
